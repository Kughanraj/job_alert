name: LinkedIn Job Alert

on:
  schedule:
    # Every 2 hours, 8:17am-10:17pm Malaysia time (UTC+8) -> 00:17-14:17 UTC.
    # Minute 17, not 0: GitHub drops/delays top-of-the-hour schedules most often.
    - cron: "17 0,2,4,6,8,10,12,14 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated seen_jobs.json

concurrency:
  group: linkedin-job-alert
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # JobStreet is read via its public search API, which works from
          # GitHub's runners. Set to "false" to switch it off.
          JOBSTREET_ENABLED: "true"
        run: python linkedin_job_alert.py

      - name: Persist seen jobs
        run: |
          git config user.name "linkedin-job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
